name: Build iOS App
on: [push, workflow_dispatch]

jobs:
  build:
    # Use macos-15 or macos-latest for the best chance of compatibility
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      # THIS IS THE FIX: Download the missing iOS 18.0 components
      - name: Install iOS Platform
        run: sudo xcodebuild -downloadPlatform iOS

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project SwingMusicApp.xcodeproj \
            -scheme SwingMusicApp \
            -destination "generic/platform=iOS" \
            -archivePath ./build/SwingMusicApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Export .app to .ipa
        run: |
          mkdir -p Payload
          cp -r ./build/SwingMusicApp.xcarchive/Products/Applications/*.app ./Payload/
          zip -r SwingMusicApp.ipa Payload

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Build
          path: SwingMusicApp.ipa
